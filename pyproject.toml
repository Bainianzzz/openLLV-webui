[project]
name = "openllv-webui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "openllv",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "swanlab>=0.9.4",
]

[tool.uv.sources]
openllv = { git = "https://github.com/glory-wan/openLLV.git" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
