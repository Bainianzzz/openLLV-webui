name: Test

on:
  pull_request:

jobs:
  test:
    name: Run all tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare config
        # config.yaml is gitignored and not present in the repo; tests need it
        run: cp example.config.yaml config.yaml

      - name: Run tests
        run: uv run pytest -q
